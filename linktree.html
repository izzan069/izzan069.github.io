<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DRIFT COLONY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #b5b5b0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px 60px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .card-wrapper {
            background-color: #f0f0ed;
            border-radius: 20px;
            padding: 32px 24px 40px;
            width: 100%;
            max-width: 580px;
            /* dari --profile-container-desktop-width asli Linktree */
            position: relative;
        }

        .top-icons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #ccc;
            background: #f0f0ed;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #333;
            font-size: 15px;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 14px;
            overflow: hidden;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #111;
            text-transform: uppercase;
        }

        .link-btn {
            display: flex;
            align-items: center;
            background-color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            width: 100%;
            text-decoration: none;
            color: #111;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: background 0.2s;
            position: relative;
        }

        .link-btn:hover {
            background-color: #e8e8e5;
            color: #111;
            text-decoration: none;
        }

        .link-btn .link-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            flex-shrink: 0;
        }

        .link-btn .link-label {
            flex: 1;
            text-align: center;
        }

        .link-btn .dots {
            font-size: 18px;
            color: #999;
            letter-spacing: 1px;
        }

        .footer-links {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #777;
        }

        .footer-links a {
            color: #777;
            text-decoration: none;
            margin: 0 6px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card-wrapper">

        <!-- Top Icons -->
        <div class="top-icons">
            <div class="icon-btn">
                <svg fill="none" height="18px" width="18px" viewBox="0 0 28 28">
                    <path
                        d="m15.7603 6.829 4.6725-4.80317 2.712 2.77734-4.9012 4.67248h6.8944v3.85565h-6.9271l4.9339 4.7922-2.712 2.7229-6.6983-6.731-6.69829 6.731-2.712-2.712 4.93387-4.7923h-6.92703v-3.86645h6.89436l-4.9012-4.67248 2.712-2.77734 4.67249 4.80317v-6.829h4.0516zm-4.0516 12.0243h4.0516v9.1489h-4.0516z"
                        fill="currentColor"></path>
                </svg>
            </div>
            <div class="icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Profile -->
        <div class="profile-section">
            <div class="profile-pic">
                <img src="https://ugc.production.linktr.ee/26d2cf4b-fc5a-484d-a016-e0355e54677b_IMG-2713.png?io=true&size=avatar-v3_0"
                    alt="Drift Colony Logo">
            </div>
            <div class="profile-name">DRIFT COLONY</div>
        </div>

        <!-- Links -->
        <a href="#" class="link-btn">
            <span class="link-icon"><i class="fas fa-globe"></i></span>
            <span class="link-label">WEBSITE</span>
            <span class="dots">···</span>
        </a>

        <a href="#" class="link-btn">
            <span class="link-icon"><i class="fas fa-envelope"></i></span>
            <span class="link-label">COLONYDRIFT@gmail.com</span>
            <span class="dots">···</span>
        </a>

        <a href="#" class="link-btn">
            <span class="link-icon"><i class="fas fa-cart-shopping"></i></span>
            <span class="link-label">SHOPEE IDN</span>
            <span class="dots">···</span>
        </a>

        <a href="#" class="link-btn">
            <span class="link-icon"><i class="fab fa-instagram"></i></span>
            <span class="link-label">INSTAGRAM</span>
            <span class="dots">···</span>
        </a>

        <a href="#" class="link-btn">
            <span class="link-icon"><i class="fab fa-tiktok"></i></span>
            <span class="link-label">TIKTOK</span>
            <span class="dots">···</span>
        </a>

        <!-- Footer -->
        <div class="footer-links">
            <a href="#">Cookie Preferences</a> &bull;
            <a href="#">Report</a> &bull;
            <a href="#">Privacy</a> &bull;
            <a href="#">Explore</a>
        </div>
    </div>
</body>

</html>
